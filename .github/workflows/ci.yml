name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: ruff check src tests packaging
      - run: pytest -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 3m5-rl-launcher-windows
            binary: dist/3m5-rl-launcher.exe
          - os: ubuntu-22.04  # older glibc = runs on more distros
            artifact: 3m5-rl-launcher-linux
            binary: dist/3m5-rl-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pyinstaller --noconfirm packaging/3m5-rl-launcher.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.binary }} --version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windowed exe: PowerShell would not wait for it on its own
          $p = Start-Process -FilePath ${{ matrix.binary }} -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mv artifacts/3m5-rl-launcher-linux/3m5-rl-launcher 3m5-rl-launcher-linux-x86_64
          mv artifacts/3m5-rl-launcher-windows/3m5-rl-launcher.exe 3m5-rl-launcher-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            3m5-rl-launcher-linux-x86_64
            3m5-rl-launcher-windows.exe

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Wine (for the end-to-end launch test)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get install -y --no-install-recommends wine64 xvfb
          echo "WINE_BIN=$(dpkg -L wine64 | grep -E '/(bin|lib/wine)/wine64$' | head -1)" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: ruff check src tests packaging
      - run: pytest -v

  # Starts a Windows exe through every supported Linux runner (real GE-Proton + umu-launcher).
  runners-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo apt-get install -y --no-install-recommends wine64 xvfb
          echo "WINE_BIN=$(dpkg -L wine64 | grep -E '/(bin|lib/wine)/wine64$' | head -1)" >> "$GITHUB_ENV"
          # umu's Steam Runtime container needs unprivileged user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: GE-Proton
        run: |
          url=$(gh api repos/GloriousEggroll/proton-ge-custom/releases/latest \
                --jq '[.assets[] | select((.name | endswith(".tar.gz")) and (.name | contains("aarch64") | not))][0].browser_download_url')
          mkdir -p "$RUNNER_TEMP/proton"
          echo "GE-Proton: $url"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP/proton"
          echo "PROTON_BIN=$(ls -d "$RUNNER_TEMP"/proton/*/proton)" >> "$GITHUB_ENV"
      - name: umu-launcher
        run: |
          url=$(gh api repos/Open-Wine-Components/umu-launcher/releases/latest \
                --jq '[.assets[] | select(.name | test("zipapp.tar$"))][0].browser_download_url')
          mkdir -p "$RUNNER_TEMP/umu"
          echo "umu-launcher: $url"
          curl -sSfL "$url" | tar -x -C "$RUNNER_TEMP/umu"
          echo "UMU_BIN=$(find "$RUNNER_TEMP/umu" -name umu-run -type f | head -1)" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: xvfb-run -a pytest -v -rs -s tests/test_runner_e2e.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 3m5-rl-launcher-windows
            binary: dist/3m5-rl-launcher.exe
          - os: ubuntu-22.04  # older glibc = runs on more distros
            artifact: 3m5-rl-launcher-linux
            binary: dist/3m5-rl-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries
        if: runner.os == 'Linux'
        # the xcb libs get bundled; libqxcb needs them and e.g. libxcb-cursor0 is missing on many desktops
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1
      - run: pip install -e .[dev]
      - run: pyinstaller --noconfirm packaging/3m5-rl-launcher.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.binary }} --version
      - name: Tag matches __version__
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(${{ matrix.binary }} --version)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != __version__ $v"; exit 1; }
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windowed exe: PowerShell would not wait for it on its own
          $p = Start-Process -FilePath ${{ matrix.binary }} -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # downloads never keep the exec bit, only an archive does
      - run: |
          name=3m5-rl-launcher-$GITHUB_REF_NAME
          mkdir "$name-linux-x86_64"
          install -m 755 artifacts/3m5-rl-launcher-linux/3m5-rl-launcher "$name-linux-x86_64/3m5-rl-launcher"
          tar -czf "$name-linux-x86_64.tar.gz" "$name-linux-x86_64"
          mv artifacts/3m5-rl-launcher-windows/3m5-rl-launcher.exe "$name-windows.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            3m5-rl-launcher-${{ github.ref_name }}-linux-x86_64.tar.gz
            3m5-rl-launcher-${{ github.ref_name }}-windows.exe

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Wine (for the end-to-end launch test)
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get install -y --no-install-recommends wine64
          echo "WINE_BIN=$(dpkg -L wine64 | grep -E '/(bin|lib/wine)/wine64$' | head -1)" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: ruff check src tests packaging
      - run: pytest -v

  # Starts a Windows exe through every supported Linux runner (real GE-Proton + umu-launcher).
  runners-e2e:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo apt-get install -y --no-install-recommends wine64
          echo "WINE_BIN=$(dpkg -L wine64 | grep -E '/(bin|lib/wine)/wine64$' | head -1)" >> "$GITHUB_ENV"
          # umu's Steam Runtime container needs unprivileged user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: GE-Proton
        run: |
          url=$(gh api repos/GloriousEggroll/proton-ge-custom/releases/latest \
                --jq '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url')
          mkdir -p "$RUNNER_TEMP/proton"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP/proton"
          echo "PROTON_BIN=$(ls -d "$RUNNER_TEMP"/proton/*/proton)" >> "$GITHUB_ENV"
      - name: umu-launcher
        run: |
          url=$(gh api repos/Open-Wine-Components/umu-launcher/releases/latest \
                --jq '.assets[] | select(.name | test("zipapp.tar$")) | .browser_download_url')
          mkdir -p "$RUNNER_TEMP/umu"
          curl -sSfL "$url" | tar -x -C "$RUNNER_TEMP/umu"
          echo "UMU_BIN=$(find "$RUNNER_TEMP/umu" -name umu-run -type f | head -1)" >> "$GITHUB_ENV"
      - run: pip install -e .[dev]
      - run: pytest -v -rs tests/test_runner_e2e.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 3m5-rl-launcher-windows
            binary: dist/3m5-rl-launcher.exe
          - os: ubuntu-22.04  # older glibc = runs on more distros
            artifact: 3m5-rl-launcher-linux
            binary: dist/3m5-rl-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e .[dev]
      - run: pyinstaller --noconfirm packaging/3m5-rl-launcher.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.binary }} --version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windowed exe: PowerShell would not wait for it on its own
          $p = Start-Process -FilePath ${{ matrix.binary }} -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mv artifacts/3m5-rl-launcher-linux/3m5-rl-launcher 3m5-rl-launcher-linux-x86_64
          mv artifacts/3m5-rl-launcher-windows/3m5-rl-launcher.exe 3m5-rl-launcher-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            3m5-rl-launcher-linux-x86_64
            3m5-rl-launcher-windows.exe
